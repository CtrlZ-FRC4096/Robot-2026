#
# Use this configuration file to control what RobotPy packages are installed
# on your RoboRIO
#

[tool.robotpy]

# Version of robotpy this project depends on
robotpy_version = "2026.2.1"

# Which extra RobotPy components should be installed
# -> equivalent to `pip install robotpy[extra1, ...]
components = ["apriltag", "commands2", "pathplannerlib", "phoenix6", "phoenix5", "robotpy-opencv"]
    # "all"
    #"apriltag"
    #"commands2"
    # "cscore"
    # "navx"
    #"pathplannerlib"
    # "phoenix5"
    #"phoenix6"
    # "playingwithfusion"
    # "rev"
    # "romi"
    # "sim"
    # "xrp"

# Other pip packages to install
requires = ["photonlibpy", "numpy", "robotpy-pykit"]

# to install opencv on roborio use py -m robotpy installer install robotpy-opencv
# but first download to computer using py -m robotpy installer download robotpy-opencv
